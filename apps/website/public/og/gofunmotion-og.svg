<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="GoFunMotion - Replace scrolling with real life">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#070816"/>
      <stop offset="0.46" stop-color="#121335"/>
      <stop offset="1" stop-color="#02030a"/>
    </linearGradient>
    <linearGradient id="motion" x1="0" x2="1">
      <stop offset="0" stop-color="#f72585"/>
      <stop offset="0.48" stop-color="#00d4ff"/>
      <stop offset="1" stop-color="#bef264"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 0.6 0 1 0 0 0.25 0 0 1 0 1 0 0 0 0.72 0"/>
      <feBlend in="SourceGraphic"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="170" cy="70" r="220" fill="#f72585" opacity="0.24"/>
  <circle cx="1030" cy="128" r="230" fill="#00d4ff" opacity="0.2"/>
  <circle cx="808" cy="560" r="210" fill="#bef264" opacity="0.16"/>
  <path d="M88 442 C238 294 386 510 552 356 C720 200 842 310 1118 154" fill="none" stroke="url(#motion)" stroke-width="16" stroke-linecap="round" opacity="0.95" filter="url(#glow)"/>
  <text x="86" y="116" fill="#ffffff" font-family="Arial, sans-serif" font-size="46" font-weight="900">Go<tspan fill="#a78bfa">Fun</tspan>Motion</text>
  <text x="86" y="224" fill="#ffffff" font-family="Arial, sans-serif" font-size="76" font-weight="900">Replace scrolling</text>
  <text x="86" y="310" fill="#ffffff" font-family="Arial, sans-serif" font-size="76" font-weight="900">with real life.</text>
  <text x="90" y="378" fill="#c7d2fe" font-family="Arial, sans-serif" font-size="29" font-weight="700">AI real-life challenges for boredom, movement, confidence, and connection.</text>
  <g transform="translate(770 292)">
    <rect x="0" y="0" width="326" height="182" rx="34" fill="#ffffff" opacity="0.1" stroke="#ffffff" stroke-opacity="0.22"/>
    <rect x="22" y="24" width="142" height="32" rx="16" fill="#bef264"/>
    <text x="42" y="47" fill="#05060f" font-family="Arial, sans-serif" font-size="16" font-weight="900">MISSION</text>
    <text x="24" y="96" fill="#ffffff" font-family="Arial, sans-serif" font-size="32" font-weight="900">Touch Grass Sprint</text>
    <text x="24" y="132" fill="#dbeafe" font-family="Arial, sans-serif" font-size="20" font-weight="700">Go outside for 7 minutes.</text>
    <text x="24" y="164" fill="#bef264" font-family="Arial, sans-serif" font-size="20" font-weight="900">+40 XP</text>
  </g>
  <rect x="86" y="462" width="326" height="54" rx="27" fill="url(#motion)"/>
  <text x="116" y="498" fill="#05060f" font-family="Arial, sans-serif" font-size="22" font-weight="900">Generate your mission</text>
</svg>
